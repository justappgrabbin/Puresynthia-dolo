<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Synthia Body</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            color: #e0e0ff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            z-index: 100;
        }
        #ui-layer > * { pointer-events: auto; }

        #top-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(10px);
        }
        #title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #mood {
            font-size: 12px;
            opacity: 0.7;
        }

        #bottom-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 18, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            transform: translateY(calc(100% - 50px));
            transition: transform 0.3s ease;
            z-index: 200;
        }
        #bottom-panel.expanded { transform: translateY(0); }

        #panel-handle {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        #panel-handle::before {
            content: '';
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
        }

        #panel-content {
            padding: 0 15px 20px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .message {
            margin: 8px 0;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        .message.system {
            background: rgba(100, 80, 180, 0.2);
            border: 1px solid rgba(100, 80, 180, 0.3);
        }
        .message.user {
            background: rgba(40, 100, 180, 0.2);
            border: 1px solid rgba(40, 100, 180, 0.3);
            margin-left: 20px;
        }
        .message.scenario {
            background: rgba(180, 120, 40, 0.2);
            border: 1px solid rgba(180, 120, 40, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #input-area {
            display: flex;
            gap: 8px;
            padding: 10px 0;
        }
        #chat-input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            color: #e0e0ff;
            font-size: 14px;
            outline: none;
        }
        #chat-input::placeholder { color: rgba(255,255,255,0.3); }
        #send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(100, 80, 200, 0.3);
            border: 1px solid rgba(100, 80, 200, 0.5);
            color: #e0e0ff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #city-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            z-index: 300;
            overflow-y: auto;
        }
        #city-overlay.active { display: block; }

        .city-header {
            padding: 60px 20px 20px;
            text-align: center;
        }
        .city-name {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .city-theme {
            font-size: 14px;
            opacity: 0.6;
        }

        .choice-card {
            margin: 15px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .choice-card:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(100, 80, 200, 0.5);
        }
        .choice-text {
            font-size: 16px;
            margin-bottom: 8px;
        }
        .choice-meta {
            font-size: 12px;
            opacity: 0.5;
        }

        #close-city {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #e0e0ff;
            font-size: 20px;
            cursor: pointer;
            z-index: 400;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="body-canvas"></canvas>
    </div>

    <div id="ui-layer">
        <div id="top-bar">
            <div id="title">Synthia</div>
            <div id="mood">Mood: Calm</div>
        </div>
    </div>

    <div id="bottom-panel">
        <div id="panel-handle"></div>
        <div id="panel-content">
            <div id="messages"></div>
            <div id="input-area">
                <input type="text" id="chat-input" placeholder="Speak to your body..." />
                <button id="send-btn">→</button>
            </div>
        </div>
    </div>

    <div id="city-overlay">
        <button id="close-city">×</button>
        <div class="city-header">
            <div class="city-name" id="city-name">City Name</div>
            <div class="city-theme" id="city-theme">Theme</div>
        </div>
        <div id="city-content"></div>
    </div>

    <script src="layer1_ato_core.js"></script>
    <script src="layer2_feature_space.js"></script>
    <script src="layer3_generative_mesh.js"></script>
    <script src="layer4_autolink.js"></script>
    <script src="layer4_diseminer.js"></script>
    <script src="layer4_autonovel.js"></script>
    <script src="layer4_worldengine.js"></script>
    <script src="layer5_ssm.js"></script>

    <script>
        // ============================================================
        // SYNTHIA BODY - WEBGL RENDERER
        // ============================================================

        const canvas = document.getElementById('body-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // ============================================================
        // BODY MAP DATA
        // ============================================================

        const centers = {
            head: { x: 0.5, y: 0.05, color: '#ffdd44', defined: false, name: 'Crown', city: 'Mind City' },
            ajna: { x: 0.5, y: 0.15, color: '#aa88ff', defined: false, name: 'Ajna', city: 'Analysis City' },
            throat: { x: 0.5, y: 0.25, color: '#44ddff', defined: true, name: 'Throat', city: 'Voice City' },
            g_center: { x: 0.5, y: 0.45, color: '#ff8844', defined: true, name: 'G-Center', city: 'Identity City' },
            ego: { x: 0.3, y: 0.40, color: '#ff4444', defined: false, name: 'Heart', city: 'Will City' },
            sacral: { x: 0.5, y: 0.60, color: '#ff44aa', defined: true, name: 'Sacral', city: 'Life City' },
            spleen: { x: 0.2, y: 0.55, color: '#44ff88', defined: false, name: 'Spleen', city: 'Instinct City' },
            solar_plexus: { x: 0.8, y: 0.55, color: '#ffaa44', defined: false, name: 'Solar Plexus', city: 'Feeling City' },
            root: { x: 0.5, y: 0.85, color: '#ff4488', defined: false, name: 'Root', city: 'Pressure City' }
        };

        const channels = [
            ['throat', 'ajna'], ['ajna', 'head'], ['g_center', 'throat'],
            ['sacral', 'g_center'], ['ego', 'g_center'], ['root', 'sacral'],
            ['spleen', 'sacral'], ['solar_plexus', 'sacral']
        ];

        // ============================================================
        // GENOMES
        // ============================================================

        const genomes = [];
        for (let i = 0; i < 20; i++) {
            genomes.push({
                channel: Math.floor(Math.random() * channels.length),
                progress: Math.random(),
                speed: 0.002 + Math.random() * 0.003,
                color: ['#44ddff', '#ff8844', '#ff44aa', '#44ff88'][Math.floor(Math.random() * 4)],
                size: 2 + Math.random() * 3
            });
        }

        // ============================================================
        // RENDERING
        // ============================================================

        let time = 0;
        let hoveredCenter = null;
        let selectedCenter = null;

        function getCenterPos(centerKey) {
            const c = centers[centerKey];
            return {
                x: c.x * width,
                y: c.y * height
            };
        }

        function drawChannel(a, b, active) {
            const pa = getCenterPos(a);
            const pb = getCenterPos(b);

            ctx.beginPath();
            ctx.moveTo(pa.x, pa.y);
            ctx.lineTo(pb.x, pb.y);

            if (active) {
                const gradient = ctx.createLinearGradient(pa.x, pa.y, pb.x, pb.y);
                gradient.addColorStop(0, 'rgba(100, 150, 255, 0.1)');
                gradient.addColorStop(0.5, 'rgba(100, 150, 255, 0.4)');
                gradient.addColorStop(1, 'rgba(100, 150, 255, 0.1)');
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;

                // Pulse effect
                const pulse = Math.sin(time * 2 + pa.x * 0.01) * 0.5 + 0.5;
                ctx.globalAlpha = 0.3 + pulse * 0.4;
            } else {
                ctx.strokeStyle = 'rgba(100, 100, 150, 0.1)';
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.3;
            }

            ctx.stroke();
            ctx.globalAlpha = 1;
        }

        function drawCenter(key, center) {
            const pos = getCenterPos(key);
            const baseRadius = center.defined ? 25 : 15;
            const pulseRadius = baseRadius + Math.sin(time * 2 + pos.x * 0.01) * 3;

            // Glow for defined centers
            if (center.defined) {
                const glow = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, pulseRadius * 3);
                glow.addColorStop(0, center.color + '40');
                glow.addColorStop(0.5, center.color + '20');
                glow.addColorStop(1, center.color + '00');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, pulseRadius * 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Center circle
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, pulseRadius, 0, Math.PI * 2);
            ctx.fillStyle = center.defined ? center.color + '80' : center.color + '30';
            ctx.fill();
            ctx.strokeStyle = center.defined ? center.color : center.color + '60';
            ctx.lineWidth = center.defined ? 2 : 1;
            ctx.stroke();

            // Label
            ctx.fillStyle = '#e0e0ff';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(center.name, pos.x, pos.y - pulseRadius - 8);

            // City name (small)
            if (center.defined) {
                ctx.fillStyle = center.color + 'aa';
                ctx.font = '9px sans-serif';
                ctx.fillText(center.city, pos.x, pos.y + pulseRadius + 14);
            }
        }

        function drawGenome(genome) {
            const ch = channels[genome.channel];
            const pa = getCenterPos(ch[0]);
            const pb = getCenterPos(ch[1]);

            genome.progress += genome.speed;
            if (genome.progress > 1) genome.progress = 0;

            const x = pa.x + (pb.x - pa.x) * genome.progress;
            const y = pa.y + (pb.y - pa.y) * genome.progress;

            // Trail
            ctx.beginPath();
            ctx.arc(x, y, genome.size * 2, 0, Math.PI * 2);
            ctx.fillStyle = genome.color + '20';
            ctx.fill();

            // Core
            ctx.beginPath();
            ctx.arc(x, y, genome.size, 0, Math.PI * 2);
            ctx.fillStyle = genome.color;
            ctx.fill();

            // Glow
            ctx.beginPath();
            ctx.arc(x, y, genome.size * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = genome.color + '40';
            ctx.fill();
        }

        function drawBackground() {
            // Subtle gradient background
            const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height));
            gradient.addColorStop(0, '#0a0a18');
            gradient.addColorStop(1, '#050510');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Subtle grid
            ctx.strokeStyle = 'rgba(100, 100, 150, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        function render() {
            time += 0.016;

            drawBackground();

            // Draw channels
            channels.forEach((ch, i) => {
                const active = centers[ch[0]].defined && centers[ch[1]].defined;
                drawChannel(ch[0], ch[1], active);
            });

            // Draw genomes
            genomes.forEach(g => drawGenome(g));

            // Draw centers
            Object.entries(centers).forEach(([key, center]) => {
                drawCenter(key, center);
            });

            requestAnimationFrame(render);
        }

        // ============================================================
        // INTERACTION
        // ============================================================

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Check if clicked on a center
            Object.entries(centers).forEach(([key, center]) => {
                const pos = getCenterPos(key);
                const dist = Math.sqrt((x - pos.x) ** 2 + (y - pos.y) ** 2);
                if (dist < 40) {
                    enterCity(key, center);
                }
            });
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            hoveredCenter = null;
            Object.entries(centers).forEach(([key, center]) => {
                const pos = getCenterPos(key);
                const dist = Math.sqrt((x - pos.x) ** 2 + (y - pos.y) ** 2);
                if (dist < 40) {
                    hoveredCenter = key;
                    canvas.style.cursor = 'pointer';
                }
            });
            if (!hoveredCenter) canvas.style.cursor = 'default';
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            Object.entries(centers).forEach(([key, center]) => {
                const pos = getCenterPos(key);
                const dist = Math.sqrt((x - pos.x) ** 2 + (y - pos.y) ** 2);
                if (dist < 50) {
                    enterCity(key, center);
                }
            });
        }, { passive: false });

        // ============================================================
        // CITY INTERFACE
        // ============================================================

        function enterCity(key, center) {
            selectedCenter = key;
            document.getElementById('city-name').textContent = center.city;
            document.getElementById('city-theme').textContent = center.name + ' Center';
            document.getElementById('city-overlay').classList.add('active');

            // Generate city content
            const content = document.getElementById('city-content');
            content.innerHTML = '';

            // Add scenario cards
            const scenarios = [
                { text: 'Enter the main hall', line: 1, hex: 1 },
                { text: 'Explore the side chambers', line: 3, hex: 5 },
                { text: 'Speak with the guardian', line: 2, hex: 17 }
            ];

            scenarios.forEach((sc, i) => {
                const card = document.createElement('div');
                card.className = 'choice-card';
                card.innerHTML = `
                    <div class="choice-text">${sc.text}</div>
                    <div class="choice-meta">Line ${sc.line} · Hexagram ${sc.hex}</div>
                `;
                card.addEventListener('click', () => makeChoice(sc));
                content.appendChild(card);
            });
        }

        function makeChoice(choice) {
            addMessage('scenario', `You chose: ${choice.text}`);
            document.getElementById('city-overlay').classList.remove('active');
        }

        document.getElementById('close-city').addEventListener('click', () => {
            document.getElementById('city-overlay').classList.remove('active');
        });

        // ============================================================
        // CHAT INTERFACE
        // ============================================================

        const messages = document.getElementById('messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const panel = document.getElementById('bottom-panel');
        const panelHandle = document.getElementById('panel-handle');

        panelHandle.addEventListener('click', () => {
            panel.classList.toggle('expanded');
        });

        function addMessage(type, text) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage('user', text);
            chatInput.value = '';

            // Simulate processing
            setTimeout(() => {
                addMessage('system', 'Processing your pattern...');

                setTimeout(() => {
                    addMessage('system', 'Detected: avoidance pattern in communication');

                    setTimeout(() => {
                        addMessage('scenario', 'A new scenario is ready: The Meeting');
                    }, 1000);
                }, 1000);
            }, 500);
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initial messages
        addMessage('system', 'Welcome to your Synthia Body');
        addMessage('system', 'Click a center to explore. Speak to process patterns.');

        // ============================================================
        // START
        // ============================================================

        render();
    </script>
</body>
</html>

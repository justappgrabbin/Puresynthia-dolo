<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synthia — Client Download</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  h1 { font-size: 24px; color: #a78bfa; margin-bottom: 12px; }
  .subtitle { color: #64748b; font-size: 14px; margin-bottom: 40px; }
  .download-card {
    background: #12121a;
    border: 1px solid rgba(124, 58, 237, 0.2);
    border-radius: 12px;
    padding: 32px;
    max-width: 400px;
    width: 100%;
  }
  .platform {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid #222;
  }
  .platform:last-child { border-bottom: none; }
  .platform-name { font-size: 14px; font-weight: 500; }
  .platform-info { color: #64748b; font-size: 11px; }
  .download-btn {
    background: #7c3aed;
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .download-btn:hover { background: #5b21b6; }
  .download-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
  .back {
    margin-top: 24px;
    color: #64748b;
    text-decoration: none;
    font-size: 12px;
  }
  .back:hover { color: #a78bfa; }
</style>
</head>
<body>
  <h1>📱 Synthia Client</h1>
  <p class="subtitle">Download the morphing substrate for your device</p>

  <div class="download-card">
    <div class="platform">
      <div>
        <div class="platform-name">iOS / Android</div>
        <div class="platform-info">React Native · Expo</div>
      </div>
      <button class="download-btn" onclick="alert('Coming soon')">Build</button>
    </div>
    <div class="platform">
      <div>
        <div class="platform-name">Web Browser</div>
        <div class="platform-info">PWA · Service Worker</div>
      </div>
      <button class="download-btn" onclick="window.open('/','_self')">Open</button>
    </div>
    <div class="platform">
      <div>
        <div class="platform-name">Desktop</div>
        <div class="platform-info">Electron · macOS · Windows</div>
      </div>
      <button class="download-btn" disabled>Soon</button>
    </div>
  </div>

  <a href="/" class="back">← Back to Synthia</a>
</body>
</html>

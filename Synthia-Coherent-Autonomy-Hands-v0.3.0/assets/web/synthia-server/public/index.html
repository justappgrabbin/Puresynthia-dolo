<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synthia — Morphing Substrate</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
  }
  .logo { font-size: 48px; margin-bottom: 20px; }
  h1 { font-size: 28px; font-weight: 600; color: #a78bfa; margin-bottom: 12px; letter-spacing: 2px; }
  .subtitle { color: #64748b; font-size: 14px; margin-bottom: 40px; max-width: 400px; line-height: 1.6; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .links a {
    display: block;
    padding: 14px 32px;
    background: #12121a;
    border: 1px solid rgba(124, 58, 237, 0.3);
    color: #a78bfa;
    text-decoration: none;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.2s;
  }
  .links a:hover {
    background: rgba(124, 58, 237, 0.1);
    border-color: #7c3aed;
  }
  .links a.primary {
    background: #7c3aed;
    color: white;
    border-color: #7c3aed;
  }
  .links a.primary:hover {
    background: #5b21b6;
  }
  .footer {
    position: fixed;
    bottom: 20px;
    color: #444;
    font-size: 11px;
  }
</style>
</head>
<body>
  <div class="logo">🜁</div>
  <h1>SYNTHIA</h1>
  <p class="subtitle">
    Morphing substrate. Fixed structure. Message passing at every level.
    64 channels. 5 modes. Emergent convergence.
  </p>
  <div class="links">
    <a href="/admin" class="primary">🔒 Admin Cockpit</a>
    <a href="/client">📱 Download Client</a>
    <a href="/admin/events">📊 System Events</a>
  </div>
  <div class="footer">Synthia v1.0 · 5D Fixed Structure · Message Passing Mesh</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04060f">
<title>Resonance OS — Living System</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  /* ═══════════════════════════════════════════
     RESONANCE OS — PHONE INTERFACE
     ═══════════════════════════════════════════ */
  :root {
    --bg: #04060f; --bg2: #080c1a;
    --surface: #0c1322; --surface2: #111d36;
    --border: rgba(255,255,255,0.06);
    --border2: rgba(255,255,255,0.1);
    --ac: #9d7bff; --ag: rgba(157,123,255,0.12);
    --gr: #1aff8c; --gg: rgba(26,255,140,0.12);
    --am: #ffb020; --mg: rgba(255,176,32,0.12);
    --rd: #ff3d5e; --rg: rgba(255,61,94,0.12);
    --vi: #b06aff; --vg: rgba(176,106,255,0.12);
    --tx: #cddff5; --t2: #607fa0; --t3: #2e4460;
    --mono: 'DM Mono', monospace; --sans: 'Syne', sans-serif;
  }
  [data-theme="ocean"] { --bg:#050d1a; --bg2:#0a1a2e; --ac:#0ea5e9; --ag:rgba(14,165,233,0.12); }
  [data-theme="forest"]{ --bg:#050f0a; --bg2:#0a1f12; --ac:#22c55e; --ag:rgba(34,197,94,0.12); }
  [data-theme="sunset"] { --bg:#1a0808; --bg2:#2a1010; --ac:#f97316; --ag:rgba(249,115,22,0.12); }
  [data-theme="neon"]  { --bg:#050510; --bg2:#0a0a1a; --ac:#d946ef; --ag:rgba(217,70,239,0.12); }
  [data-theme="ice"]   { --bg:#f0f4f8; --bg2:#e2e8f0; --tx:#1e293b; --t2:#64748b; --t3:#94a3b8; --surface:#ffffff; --surface2:#f1f5f9; --border:rgba(0,0,0,0.08); }

  *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

  html, body { height:100%; background:var(--bg); color:var(--tx); font-family:var(--sans); overflow:hidden; }

  /* Background layers */
  body::before {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image: linear-gradient(rgba(157,123,255,.015) 1px,transparent 1px), linear-gradient(90deg,rgba(157,123,255,.015) 1px,transparent 1px);
    background-size: 40px 40px;
  }
  .mesh-bg { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
  .mesh-orb { position:absolute; border-radius:50%; filter:blur(100px); opacity:0.15; animation:orbFloat 25s ease-in-out infinite alternate; }
  .mesh-orb.a { width:350px; height:350px; background:var(--ac); top:-15%; left:-15%; }
  .mesh-orb.b { width:280px; height:280px; background:var(--vi); bottom:-8%; right:-20%; animation-delay:-8s; }
  .mesh-orb.c { width:220px; height:220px; background:var(--gr); top:45%; left:55%; animation-delay:-16s; }
  @keyframes orbFloat { 0%{transform:translate(0,0)scale(1)} 100%{transform:translate(40px,-50px)scale(1.2)} }
  .noise { position:fixed; inset:0; z-index:999; pointer-events:none; opacity:0.03;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:256px;
  }
  .scanlines { position:fixed; inset:0; z-index:998; pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 4px);
  }

  /* Layout */
  #app { width:100%; max-width:430px; height:100vh; margin:0 auto; position:relative; display:flex; flex-direction:column; z-index:1; }

  /* ── HEADER ── */
  .rosh {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; flex-shrink:0; position:relative; z-index:10;
    background:rgba(4,6,15,0.7); backdrop-filter:blur(16px); border-bottom:1px solid var(--border);
  }
  .rosh-left { display:flex; align-items:center; gap:10px; }
  .rosh-led { width:8px; height:8px; border-radius:50%; background:var(--t3); transition:all 0.5s; position:relative; }
  .rosh-led::after { content:''; position:absolute; inset:-3px; border-radius:50%; opacity:0; transition:opacity 0.5s; }
  .rosh-led.dormant   { background:var(--t3); }
  .rosh-led.observing { background:var(--am); box-shadow:0 0 8px var(--mg); }
  .rosh-led.active    { background:var(--ac); box-shadow:0 0 10px var(--ag); }
  .rosh-led.resonant  { background:var(--gr); box-shadow:0 0 12px var(--gg); animation:ledPulse 1.5s infinite; }
  @keyframes ledPulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .rosh-title { font-family:var(--sans); font-size:14px; font-weight:700; letter-spacing:.04em; }
  .rosh-right { display:flex; align-items:center; gap:10px; }
  .rosh-vital { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:4px 8px; color:var(--t2); font-family:var(--mono); font-size:9px; cursor:pointer; outline:none; }
  .rosh-clock { font-family:var(--mono); font-size:11px; color:var(--t2); }

  /* ── MAIN ── */
  .rosm { flex:1; position:relative; overflow-y:auto; overflow-x:hidden; }
  .rosm::-webkit-scrollbar { width:0; }

  /* Wallpaper */
  .wallpaper { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:12px; text-align:center; }
  .wallpaper-glyph { font-size:42px; opacity:0.15; letter-spacing:8px; }
  .wallpaper-title { font-size:22px; font-weight:700; letter-spacing:.06em; }
  .wallpaper-sub  { font-family:var(--mono); font-size:9px; color:var(--t3); letter-spacing:.18em; text-transform:uppercase; }

  /* App grid on home */
  .app-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; padding:20px 16px; }
  .app-tile { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; }
  .app-tile:active { transform:scale(0.94); }
  .app-icon {
    width:56px; height:56px; border-radius:14px; background:var(--surface);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:18px; color:var(--ac); transition:all 0.2s;
    position:relative; overflow:hidden;
  }
  .app-tile:hover .app-icon { border-color:rgba(157,123,255,0.3); box-shadow:0 0 16px var(--ag); }
  .app-icon.ac2 { color:var(--vi); }
  .app-icon.ac3 { color:var(--gr); }
  .app-icon.ac4 { color:var(--am); }
  .app-icon.ac5 { color:var(--rd); }
  .app-label { font-family:var(--mono); font-size:9px; color:var(--t2); text-transform:uppercase; letter-spacing:.06em; }

  /* Window */
  .window { position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; background:rgba(4,6,15,0.92); backdrop-filter:blur(20px); animation:winIn 0.18s ease; }
  @keyframes winIn { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:none} }
  .win-tb { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .win-tb span { font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:.1em; color:var(--t2); text-transform:uppercase; }
  .win-close { width:28px; height:28px; border-radius:8px; background:var(--surface); border:1px solid var(--border); color:var(--tx); font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.15s; }
  .win-close:hover { border-color:var(--rd); color:var(--rd); box-shadow:0 0 10px var(--rg); }
  .win-body { flex:1; overflow-y:auto; overflow-x:hidden; padding:12px 14px 20px; }
  .win-body::-webkit-scrollbar { width:3px; }
  .win-body::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

  /* ── DOCK ── */
  .rosd {
    display:flex; align-items:center; justify-content:space-around;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom,10px));
    background:rgba(4,6,15,0.85); backdrop-filter:blur(24px) saturate(1.3);
    border-top:1px solid var(--border); flex-shrink:0; position:relative; z-index:10;
  }
  .dk-btn { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; background:none; border:none; padding:4px 8px; border-radius:8px; transition:background 0.15s; color:inherit; }
  .dk-btn:hover { background:var(--ag); }
  .dk-btn:active { transform:scale(0.94); }
  .dk-icon {
    width:40px; height:40px; border-radius:10px; background:var(--surface);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:15px; color:var(--ac); transition:all 0.2s;
  }
  .dk-btn:hover .dk-icon { border-color:rgba(157,123,255,0.3); box-shadow:0 0 12px var(--ag); }
  .dk-btn.on .dk-icon { border-color:var(--ac); background:var(--ag); box-shadow:0 0 10px var(--ag); }
  .dk-label { font-family:var(--mono); font-size:8px; color:var(--t3); text-transform:uppercase; letter-spacing:.06em; }
  .dk-btn.on .dk-label { color:var(--ac); }

  /* ── COMPONENTS ── */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; }
  .card h3 { font-size:12px; font-weight:600; margin-bottom:6px; letter-spacing:.04em; }
  .card p { font-size:11px; color:var(--t2); line-height:1.5; font-family:var(--mono); }
  .sublabel { font-family:var(--mono); font-size:8px; color:var(--t3); text-transform:uppercase; letter-spacing:.14em; margin:12px 0 6px; }

  .btn { padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--tx); font-size:11px; font-weight:600; cursor:pointer; transition:all 0.15s; display:inline-flex; align-items:center; gap:6px; font-family:var(--sans); letter-spacing:.03em; }
  .btn:hover { border-color:var(--ac); box-shadow:0 0 12px var(--ag); }
  .btn:active { transform:scale(0.96); }
  .btn-pri { background:var(--ac); border-color:var(--ac); color:#000; box-shadow:0 0 16px var(--ag); }
  .btn-pri:hover { filter:brightness(1.15); }
  .btn-sm { padding:5px 10px; font-size:9px; border-radius:6px; }
  .btn-blk { width:100%; justify-content:center; }

  .input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg2); color:var(--tx); font-size:12px; outline:none; margin-bottom:6px; font-family:var(--mono); transition:border-color 0.15s; }
  .input:focus { border-color:var(--ac); box-shadow:0 0 8px var(--ag); }
  .input::placeholder { color:var(--t3); }

  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .sbox { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px; text-align:center; }
  .sbox .val { font-size:16px; font-weight:700; font-family:var(--mono); }
  .sbox .lab { font-size:8px; color:var(--t2); text-transform:uppercase; font-family:var(--mono); letter-spacing:.08em; margin-top:2px; }

  .gate-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:2px; }
  .gate-cell { aspect-ratio:1; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:600; background:var(--surface2); border:1px solid var(--border); font-family:var(--mono); transition:all 0.2s; }
  .gate-cell.on { background:var(--ag); border-color:var(--ac); color:var(--ac); box-shadow:0 0 6px var(--ag); }

  .upload-zone { border:2px dashed var(--border); border-radius:10px; padding:20px; text-align:center; cursor:pointer; transition:all 0.2s; margin:8px 0; }
  .upload-zone:hover { border-color:var(--ac); background:var(--ag); }
  .upload-zone .ic { font-family:var(--mono); font-size:28px; margin-bottom:6px; color:var(--ac); opacity:0.5; }
  .upload-zone p { font-family:var(--mono); font-size:10px; color:var(--t2); }

  .fitem { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; margin-bottom:4px; font-family:var(--mono); font-size:11px; color:var(--t2); }
  .fitem::before { content:'◈'; color:var(--ac); font-size:10px; }

  .progress-bg { height:3px; background:var(--surface2); border-radius:2px; overflow:hidden; }
  .progress-fill { height:100%; border-radius:2px; box-shadow:0 0 6px currentColor; }

  .tabbar { display:flex; gap:2px; background:var(--surface2); border-radius:10px; padding:3px; margin-bottom:10px; border:1px solid var(--border); }
  .tabbar .tbtn { flex:1; justify-content:center; border:none; background:transparent; color:var(--t2); padding:5px; font-size:9px; border-radius:7px; cursor:pointer; font-family:var(--mono); text-transform:uppercase; letter-spacing:.06em; transition:all 0.15s; }
  .tabbar .tbtn.on { background:var(--ag); color:var(--ac); }

  .notif { position:fixed; top:50px; left:50%; transform:translateX(-50%) translateY(-100px); background:var(--surface); border:1px solid var(--border2); border-radius:10px; padding:8px 14px; display:flex; align-items:center; gap:8px; z-index:300; transition:transform 0.3s; max-width:90%; font-size:10px; font-family:var(--mono); backdrop-filter:blur(12px); box-shadow:0 8px 28px rgba(0,0,0,0.5); }
  .notif.show { transform:translateX(-50%) translateY(0); }

  .modal-o { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; display:none; align-items:flex-end; justify-content:center; padding:12px; }
  .modal-o.show { display:flex; }
  .modal-c { width:100%; max-height:85vh; background:var(--surface); border:1px solid var(--border2); border-radius:20px 20px 0 0; padding:16px; overflow-y:auto; box-shadow:0 -16px 50px rgba(0,0,0,0.5); animation:sup 0.22s cubic-bezier(.4,0,.2,1); }
  @keyframes sup { from{transform:translateY(100%)} to{transform:translateY(0)} }

  .store-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .store-item { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px; text-align:center; cursor:pointer; transition:all 0.2s; }
  .store-item:hover { border-color:var(--ac); background:var(--ag); }
  .store-item .ic { font-family:var(--mono); font-size:24px; margin-bottom:4px; color:var(--ac); display:block; }
  .store-item .nm { font-size:10px; font-weight:600; }
  .store-item .ds { font-size:8px; color:var(--t2); font-family:var(--mono); }

  .browser-bar { display:flex; gap:6px; align-items:center; padding:8px; background:var(--surface2); border-radius:8px; margin-bottom:8px; border:1px solid var(--border); }
  .browser-frame { width:100%; height:calc(100% - 60px); border:none; border-radius:8px; background:#fff; }
  .qtiles { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:8px; }
  .qtile { background:var(--surface2); border-radius:8px; padding:8px; text-align:center; cursor:pointer; border:1px solid var(--border); transition:all 0.2s; font-family:var(--mono); }
  .qtile:hover { border-color:var(--ac); }
  .qtile .ic { font-size:18px; display:block; margin-bottom:2px; }
  .qtile .lb { font-size:8px; color:var(--t2); }

  .arc-wrap { position:absolute; inset:0; z-index:1; }
  .arc-ui  { position:relative; z-index:2; pointer-events:none; height:100%; display:flex; flex-direction:column; justify-content:space-between; padding:12px; }
  .arc-ui .btn, .arc-ui .badge { pointer-events:auto; }

  .theme-chip { width:32px; height:32px; border-radius:50%; border:2px solid transparent; cursor:pointer; transition:all 0.2s; }
  .theme-chip:hover { transform:scale(1.1); }
  .theme-chip.on { border-color:var(--tx); box-shadow:0 0 8px rgba(255,255,255,0.2); }
  .theme-chip.dark { background:#0a0a12; } .theme-chip.ocean { background:#0f2540; }
  .theme-chip.forest { background:#122a12; } .theme-chip.sunset { background:#2a1010; }
  .theme-chip.neon { background:#0a0a1a; border-color:#d946ef; } .theme-chip.ice { background:#e2e8f0; border-color:#3b82f6; }

  .info-box { background:rgba(157,123,255,0.04); border:1px solid rgba(157,123,255,0.1); border-radius:6px; padding:10px 12px; font-family:var(--mono); font-size:10px; color:var(--t2); line-height:1.6; margin:8px 0; }
</style>
</head>
<body>
<div id="app">

<!-- Background effects -->
<div class="mesh-bg"><div class="mesh-orb a"></div><div class="mesh-orb b"></div><div class="mesh-orb c"></div></div>
<div class="noise"></div>
<div class="scanlines"></div>

<!-- Notification -->
<div class="notif" id="notif"><span id="ni">ℹ</span><span id="nt"></span></div>

<!-- HEADER -->
<div class="rosh">
  <div class="rosh-left">
    <div class="rosh-led dormant" id="led"></div>
    <span class="rosh-title">⬡ Resonance OS</span>
  </div>
  <div class="rosh-right">
    <select class="rosh-vital" id="vital" onchange="setVital(this.value)">
      <option value="dormant">DORMANT</option><option value="observing">OBSERVING</option>
      <option value="active" selected>ACTIVE</option><option value="resonant">RESONANT</option>
    </select>
    <span class="rosh-clock" id="clock"></span>
  </div>
</div>

<!-- MAIN -->
<div class="rosm" id="main">

  <!-- Wallpaper (shown when no window open) -->
  <div class="wallpaper" id="wallpaper">
    <div class="wallpaper-glyph">⬡ ⬡ ⬡</div>
    <div class="wallpaper-title">Resonance OS</div>
    <div class="wallpaper-sub">Living System</div>

    <!-- App Grid -->
    <div class="app-grid">
      <div class="app-tile" onclick="openWin('home')"><div class="app-icon">⌂</div><div class="app-label">Home</div></div>
      <div class="app-tile" onclick="openWin('morph')"><div class="app-icon ac5">◈</div><div class="app-label">Morph</div></div>
      <div class="app-tile" onclick="openWin('bodygraph')"><div class="app-icon ac2">✦</div><div class="app-label">Design</div></div>
      <div class="app-tile" onclick="openWin('health')"><div class="app-icon ac4">♥</div><div class="app-label">Health</div></div>
      <div class="app-tile" onclick="openWin('engine')"><div class="app-icon ac3">⚡</div><div class="app-label">Engine</div></div>
      <div class="app-tile" onclick="openWin('well')"><div class="app-icon">▣</div><div class="app-label">Well</div></div>
      <div class="app-tile" onclick="openWin('library')"><div class="app-icon ac5">◫</div><div class="app-label">Library</div></div>
      <div class="app-tile" onclick="openWin('browser')"><div class="app-icon">◎</div><div class="app-label">Web</div></div>
    </div>
  </div>

</div>

<!-- DOCK -->
<div class="rosd">
  <button class="dk-btn on" onclick="goHome()" id="dk-home"><div class="dk-icon">⌂</div><span class="dk-label">Home</span></button>
  <button class="dk-btn" onclick="openWin('morph')" id="dk-morph"><div class="dk-icon">◈</div><span class="dk-label">Morph</span></button>
  <button class="dk-btn" onclick="openWin('well')" id="dk-well"><div class="dk-icon">▣</div><span class="dk-label">Well</span></button>
  <button class="dk-btn" onclick="openWin('library')" id="dk-lib"><div class="dk-icon">◫</div><span class="dk-label">Library</span></button>
  <button class="dk-btn" onclick="openWin('browser')" id="dk-web"><div class="dk-icon">◎</div><span class="dk-label">Web</span></button>
  <button class="dk-btn" onclick="openWin('settings')" id="dk-set"><div class="dk-icon">⚙</div><span class="dk-label">Setup</span></button>
</div>

<!-- WIDGET STORE MODAL -->
<div class="modal-o" id="wsm" onclick="if(event.target===this)closeWS()"><div class="modal-c"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div><div style="font-size:13px;font-weight:700">Widget Store</div><div class="sublabel" style="margin:0">Tap to add</div></div><button class="btn btn-sm" onclick="closeWS()">✕</button></div><div class="store-grid" id="sg"></div></div></div>

function ona(name,ext,type,size,content){
 const c=FT[ext]||{g:1}; let h=0,ch=0; for(let i=0;i<name.length;i++)h=(h<<5)-h+name.charCodeAt(i);
 if(content){for(let i=0;i<Math.min(content.length,100);i++)ch=((ch<<5)-ch)+content.charCodeAt(i)}
 const sc=size<1024?1:size<10240?2:size<102400?3:size<1048576?4:size<10485760?5:6;
 const gate=c.g||(Math.abs(h)%64)+1,line=(Math.abs(h)%6)+1,color=((type||'').length%6)+1;
 const tone=(ext.length%6)+1,base=sc,zodiac=(Math.abs(ch)%12)+1;
 return{gate,line,color,tone,base,zodiac,full:`${gate}.${line}.${color}.${tone}.${base}.${zodiac}`}
}

const G2C={};Object.entries(CODON).forEach(([a,d])=>d.g.forEach(g=>G2C[g]=a));
function chnops(gates){
 const r={C:0,H:0,N:0,O:0,S:0,P:0};gates.forEach(g=>{const c=G2C[g],d=c?CODON[c]:null;if(d)Object.keys(r).forEach(e=>{if(e!=='P')r[e]+=d.f[e]||0})});
 r.P=(r.N*3)+(r.O*2)+(r.S*5);const sum=Object.values(r).reduce((a,b)=>a+Math.exp(b*0.01),0);
 const n={};Object.keys(r).forEach(k=>n[k]=Math.exp(r[k]*0.01)/sum);return{raw:r,norm:n}
}

function jd(d){return 2451545+(d.getTime()-Date.UTC(2000,0,1,12))/86400000}
function solveKepler(M,e){let E=M,d;for(let i=0;i<8;i++){d=E-e*Math.sin(E)-M;E-=d/(1-e*Math.cos(E))}return E}
function plong(elt,date){
 const T=(jd(date)-2451545)/36525,a=elt.a,e=elt.e+(elt.de||0)*T;
 const i=(elt.i+(elt.di||0)*T)*Math.PI/180,om=(elt.om+(elt.dom||0)*T)*Math.PI/180;
 let L=(elt.L+(elt.dL||360/elt.p)*T*36525)%360;if(L<0)L+=360;
 let lp=(elt.lp+(elt.dlp||0)*T)%360;if(lp<0)lp+=360;
 let M=((L-lp)%360)*Math.PI/180;if(M<0)M+=2*Math.PI;
 const E=solveKepler(M,e),xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E);
 const v=Math.atan2(yv,xv),r=Math.sqrt(xv*xv+yv*yv);
 const xh=r*(Math.cos(om)*Math.cos(v+lp*Math.PI/180)-Math.sin(om)*Math.sin(v+lp*Math.PI/180)*Math.cos(i));
 const yh=r*(Math.sin(om)*Math.cos(v+lp*Math.PI/180)+Math.cos(om)*Math.sin(v+lp*Math.PI/180)*Math.cos(i));
 return Math.atan2(yh,xh)*180/Math.PI
}

function deg2gate(deg){

 const ln=Math.floor(wg/0.9375)+1,wl=wg%0.9375,cn=Math.floor(wl/0.15625)+1;

 const bn=Math.floor(wt/0.005208333)+1;
 return{gate:gn,line:ln,color:cn,tone:tn,base:bn,zodiac:Math.floor(nd/30)+1,degree:nd,full:`${gn}.${ln}.${cn}.${tn}.${bn}.${Math.floor(nd/30)+1}`}
}

 return EPH.map(e=>{const deg=plong(e,d);const g=deg2gate(deg);return{name:e.n,degree:deg,...g}})

 const t=compTransits(date||new Date()),a=[];
 t.forEach(x=>natal.forEach(g=>{if(x.gate===g)a.push({type:'conjunction',planet:x.name,gate:g,strength:1,deg:x.degree})}));

function syncHealth(){
 const hr=parseInt(document.getElementById('h-hr-in')?.value)||0;
 const st=parseInt(document.getElementById('h-steps-in')?.value)||0;
 const sl=parseFloat(document.getElementById('h-sleep-in')?.value)||0;
 const md=parseInt(document.getElementById('h-mood-in')?.value)||5;
 document.getElementById('h-hr').textContent=hr||'—';
 document.getElementById('h-steps').textContent=st||'—';
 document.getElementById('h-sleep').textContent=sl||'—';
 document.getElementById('h-mood').textContent=md||'—';
 sendHealth(hr,st,sl);
 saveHealth({hr,st,sl,md,t:Date.now()})
}
function saveHealth(d){try{let h=JSON.parse(localStorage.getItem('ros_health')||'[]');h.push(d);if(h.length>365)h=h.slice(-365);localStorage.setItem('ros_health',JSON.stringify(h))}catch{}}
function loadHealth(){try{const h=JSON.parse(localStorage.getItem('ros_health')||'[]');if(!h.length)return;const last=h[h.length-1];if(last.hr)document.getElementById('h-hr').textContent=last.hr;if(last.st)document.getElementById('h-steps').textContent=last.st;if(last.sl)document.getElementById('h-sleep').textContent=last.sl;if(last.md)document.getElementById('h-mood').textContent=last.md}catch{}}
</script>

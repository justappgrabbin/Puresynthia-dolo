<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Synthia Recursive Media Field v1</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #f3f3f7; font: 15px system-ui, sans-serif; }
    main { max-width: 980px; margin: auto; padding: 24px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); }
    .card { background: #15151d; border: 1px solid #313143; border-radius: 14px; padding: 16px; }
    canvas { width: 100%; image-rendering: pixelated; border: 1px solid #444; border-radius: 10px; }
    label { display: block; margin: 10px 0 4px; }
    input, button { width: 100%; box-sizing: border-box; padding: 10px; }
    button { margin-top: 10px; cursor: pointer; }
    pre { white-space: pre-wrap; max-height: 360px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
<main>
  <h1>Synthia Recursive Media Field v1</h1>
  <p>Load a sprite sheet, learn its Fu-Xi transition sequence, and generate addressed in-between animation.</p>
  <div class="grid">
    <section class="card">
      <input id="file" type="file" accept="image/*">
      <label>Columns</label>
      <input id="columns" type="number" min="1" value="4">
      <label>Rows</label>
      <input id="rows" type="number" min="1" value="1">
      <button id="learn">Learn sprite sheet</button>
      <button id="animate">Animate learned sequence</button>
    </section>
    <section class="card">
      <canvas id="output" width="256" height="256"></canvas>
    </section>
    <section class="card">
      <strong>System state — operator switching + recursive growth</strong>
      <pre id="log">Ready.</pre>
    </section>
  </div>
</main>
<script type="module">
  import { RecursiveMediaOrgan } from "./src/synthia-recursive-media-field.js";

  const organ = new RecursiveMediaOrgan();
  const file = document.querySelector("#file");
  const columns = document.querySelector("#columns");
  const rows = document.querySelector("#rows");
  const output = document.querySelector("#output");
  const log = document.querySelector("#log");
  let image = null;
  let controller = null;

  file.addEventListener("change", async () => {
    const selected = file.files?.[0];
    if (!selected) return;
    image = await createImageBitmap(selected);
    log.textContent = `Loaded ${image.width} × ${image.height}`;
  });

  document.querySelector("#learn").addEventListener("click", () => {
    if (!image) {
      log.textContent = "Choose a sprite-sheet image first.";
      return;
    }

    const learned = organ.ingestSpriteSheet(image, {
      columns: Number(columns.value),
      rows: Number(rows.value),
    });

    const firstFrame = organ.morphEngine.sheet.frames[0];
    output.width = firstFrame.canvas.width;
    output.height = firstFrame.canvas.height;
    output.getContext("2d").drawImage(firstFrame.canvas, 0, 0);

    log.textContent = JSON.stringify({
      spriteSheetAddress: learned.address.id,
      frames: learned.frames,
      transitionCount: organ.field.transitions.length,
      fieldTick: organ.field.tickCount,
      operatorBank: organ.morphEngine.operatorSwitcher.operators,
      learnedRelations: [...organ.morphEngine.learnedRelations.values()].map(r => ({
        fromFuXi: r.fromFuXi,
        toFuXi: r.toFuXi,
        operator: r.operator,
        relation: r.relation,
      })),
    }, null, 2);
  });

  document.querySelector("#animate").addEventListener("click", async () => {
    if (!organ.morphEngine.sheet) {
      log.textContent = "Learn a sprite sheet first.";
      return;
    }
    controller?.abort();
    controller = new AbortController();
    await organ.morphEngine.animate({
      canvas: output,
      framesPerPair: 6,
      framesPerSecond: 18,
      loop: true,
      signal: controller.signal,
    });
  });
</script>
</body>
</html>
